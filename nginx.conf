server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # One HTML file, so compress it and don't let anyone cache a stale copy of it.
  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;
  gzip_min_length 512;

  location = / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files /index.html =404;
  }

  # Versioned artifacts: the demo video ships in the image under /assets, and
  # the DMG is either a GitHub release link (nothing to serve) or a server-side
  # volume mounted at /usr/share/nginx/html/downloads. Names carry the version,
  # so cache hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /downloads/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
}
